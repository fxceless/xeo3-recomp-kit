# The Xbox 360 NXE dashboard, dash.xex 2.0.17003.0 (built 2014-10-28) -- XenonRecomp config.
# Used by scripts\recompile-dashboard.ps1, which copies it to games\dash\config.toml.
#
# It fits ONE build of dash.xex and no other: every address below is that build's.
# recompile-dashboard.ps1 checks the file against dashboard\dash.json before using it.
# See docs\DASHBOARD.md for where that dash.xex comes from.
#
# WHY RECOMPILE IT AT ALL. The 2014 back-compat packages that carry this dash.xex also
# carry a precompiled DLL for it, but in the OLD emulator ABI (exports
# GetPrecompiledHashData / PrecompiledFunctionPointers). The current Emu.exe requires
# InitPrecompiledDll / CleanupPrecompiledDll / PrecompiledPointers and refuses the old one.
#
# XexRepack leaves the header region byte-identical, so dash_dec.xex hashes to the same
# DLL name as dash.xex (xeo3_c78b4e60_cf714a41_cb4682a0_d5cedc3e_04f30dfe) and the
# emulator finds our DLL for it.
#
# NOTE the image base: the dash links at 0x92000000 (the system-module region), not the
# 0x82000000 title region a game uses.

[main]
file_path = "./xex/dash_dec.xex"
out_directory_path = "./ppc"
switch_table_file_path = "./switch.toml"

# The C runtime's setjmp/longjmp. Naming them makes the recompiler emit PPC_SETJMP() /
# PPC_LONGJMP() in place of the calls. Left unnamed they are plain functions and a guest
# longjmp just RETURNS to its caller: Lua's luaD_throw (0x928C1D38, `bl longjmp` at +0x30,
# panic path at +0x34) then falls into panic()/exit(), and the dash quits on the first Lua
# error it would normally catch (the first one is an empty UI string, which is blank by
# design). Found by reading the CRT bodies:
# setjmp 0x928F9320 (stfd f14..f31 / std r13..r31 / stvlx128 v64..v127 / LR,CR,r1),
# longjmp 0x928F8EF0 (the inverse, then mtlr/blr).
setjmp_address = 0x928F9320
longjmp_address = 0x928F8EF0

# Given by XenonAnalyse
restgprlr_14_address = 0x921944B0
savegprlr_14_address = 0x92194460
restfpr_14_address = 0x9280DE1C
savefpr_14_address = 0x9280DDD0
restvmx_14_address = 0x92810088
savevmx_14_address = 0x9280FDF0
restvmx_64_address = 0x9281011C
savevmx_64_address = 0x9280FE84

# Function boundaries, prevents "switch statement jumps outside function" errors.
# Generated by the boundary loop (tools\fix_boundaries.py) from the recompiler's own error
# output -- never hand-sized: hand-guessed widths broke two switches that already worked.
functions = [
    { address = 0x922743D0, size = 0xB8 },
    { address = 0x922813B8, size = 0x104 },
    { address = 0x922814C8, size = 0x124 },
    { address = 0x922D2778, size = 0xD4 },
    { address = 0x9235FCE8, size = 0xA4 },
    { address = 0x9235FF20, size = 0x90 },
    { address = 0x923601D8, size = 0x1E0 },
    { address = 0x9236F270, size = 0x94 },
    { address = 0x92373B28, size = 0x180 },
    { address = 0x92431458, size = 0xAC },
    { address = 0x924939B0, size = 0x120 },
    { address = 0x925185A8, size = 0x28C },
    { address = 0x926525A0, size = 0x78 },
    { address = 0x92690F20, size = 0x68 },
    { address = 0x92743CF0, size = 0x70 },
    { address = 0x927B2BE0, size = 0x110 },
    { address = 0x927E5550, size = 0x118 },
    { address = 0x927E57A8, size = 0xC8 },
    { address = 0x927FBB70, size = 0xE0 },
    { address = 0x9281E958, size = 0x188 },
    { address = 0x92823B88, size = 0x194 },
    { address = 0x92880FC8, size = 0x80 },
    { address = 0x928EC200, size = 0x1C8 },
]

# First 4 bytes and size of any data wrongly interpreted as instructions
invalid_instructions = [
]

# MMIO (GPU register block at 0x7FC8_0000). The first boot took an access violation on
# exactly this -- a load of guest 0x7FC86544, which is not backed by memory. Anything not
# listed here is emitted as a plain load/store, so every GPU register access has to be
# enumerated. Found by tracking registers loaded with 0x7FC8_0000 (`lis rX,32712`) through
# the disassembly, the same way tools\mmio_scan.py does for a game. 0x921AB4B0 is the
# instruction that faulted.
mmio_instructions = [
    0x921A0420,   # stw r11, 0x6110(r10)
    0x921A062C,   # stw r30, 0x6110(r11)
    0x921AB364,   # stw r4, 0x714(r11)
    0x921AB4B0,   # lwz r11, 0x6544(r11)
    0x921ABE94,   # stw r11, 0x714(r10)
    0x921AFD00,   # lwz r9, 0x112c(r10)
    0x921AFD84,   # lwz r10, 0xe5c(r10)
    0x921B18E0,   # stw r10, 0x3214(r11)
    0x921B18EC,   # stw r10, 0x3408(r11)
    0x921B8BEC,   # lwz r3, 0x6034(r11)
    0x921C53EC,   # lwz r7, 0x112c(r7)
]
