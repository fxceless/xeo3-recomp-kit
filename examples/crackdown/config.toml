# Crackdown (Xbox 360, titleId 0x4D5307DC) — XenonRecomp-XEO3 config.
#
# Source: the Crackdown disc -> /Default.xex (14,270,464 bytes, md5
# a4c8a553ce76ddd792bc1141fd0b16fc), extracted with xdvdfs. Retail-encrypted
# (enc=1) with BASIC compression (comp=1), which XenonUtils\xex.cpp handles directly --
# no XexRepack step (as Fable II).
#
#   load_address 0x82000000   image_size 0x1670000   entry 0x82745DA8
#   imports: xam.xex + xboxkrnl.exe ONLY   XDK 2.0.4802 (oldest title on this project)
#
# Target DLL name (tools\xeo3_name.py, from the header digest at security+0x164):
#   xeo3_14cefedb_c6da7da6_65145c7f_9e12e13b_80eef7c7(.dll/_no.dll)

[main]
file_path = "./xex/default.xex"
out_directory_path = "./ppc"
switch_table_file_path = "./switch.toml"

