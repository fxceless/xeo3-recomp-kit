# ---------------------------------------------------------------------------
# THE CRT's setjmp/longjmp (A6, found by behaviour, not by Fable II's bytes).
# Naming them makes the recompiler emit PPC_SETJMP()/PPC_LONGJMP() at the call site
# (both `bl` and tail-call `b`, via printFunctionCall). Left unnamed, a guest longjmp
# just RETURNS to its caller -- the s33/s35 dashboard death.
#
# Same jmp_buf layout as Fable II (+144 = r1, +304 = CR, +308 = LR, +312 = flag):
#   setjmp  0x82AC2330: lwz r0,0x835D95C4 / bnectr (an optional override hook, taken
#                       only if nonzero) / mflr r0 / mfcr r4 / stfd f14..f31 /
#                       std r13..r31 / stvlx128 / stw LR,308 / stw CR,304 /
#                       std r1,144 / stw 0,312 / li r3,0 / blr
#   longjmp 0x82AC1CA0: mr r6,r4 (0 -> 1) / mr r7,r3 / flag at 312 == 0 path:
#                       bl 0x82AD1650 (stores 3 words to a global: a debugger
#                       notify, skipped harmlessly by PPC_LONGJMP) / restore
#                       f/v/r13..r31 / mtlr 308 / ld r1,144 / mtcr 304 / mr r3,r6 / blr
#                       (flag != 0 path = an unwind via 0x82B67F04; our setjmp always
#                       stores 0 there)
# 11 `bl setjmp` sites (0 tail calls); 29 `bl longjmp` + 4 `b longjmp` sites.
setjmp_address  = 0x82AC2330
longjmp_address = 0x82AC1CA0
# ---------------------------------------------------------------------------

